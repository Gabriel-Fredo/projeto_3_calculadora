<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@100..800&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="./src/img/calculate_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" type="image/x-icon">
    <title>Calculadora</title>
  </head>
  <body>
    <main>
      <h1>Calculadora online</h1>
      <input type="text" name="visor" id="visor" disabled />
      <div id="teclado">
        <button type="reset" id="reset">C</button>
        
        <button type="button" class="botoes">*</button>
        <button type="button" class="botoes">/</button>
        <button type="button" class="botoes">7</button>
        <button type="button" class="botoes">8</button>
        <button type="button" class="botoes">9</button>
        <button type="button" class="botoes">-</button>
        
        <button type="button" class="botoes">4</button>
        <button type="button" class="botoes">5</button>
        <button type="button" class="botoes">6</button>
        <button type="button" class="botoes">+</button>
        
        <button type="button" class="botoes">1</button>
        <button type="button" class="botoes">2</button>
        <button type="button" class="botoes">3</button>
        <button type="submit" id="enviar">=</button>
        <button type="button" class="botoes">.</button>
        <button type="button" class="botoes" id="botao0">0</button>
        <button type="button" class="botoes">%</button>
      </div>
    </main>
    <footer>
      <nav id="nav1">
        <a href="https://gabriel-fredo.github.io/Meu-primeiro-portf-lio-de-verdade-/">Voltar ao Portfólio</a>
      </nav>
    </footer>
    <script src="./src/js/script.js"></script>
  </body>
</html>
